table: operators
layer: gold.canonical

business_purpose: >
  One row per real-world charter, fractional, corporate, or related aviation
  operator. Canonical identity that unifies FAA, ARGUS, Wyvern, ADS-B, and
  manual records. Every agent-facing view joins back to this id.

grain: one row per distinct real-world operator, identified by UUID
owner: solo:phelipe
refresh_cadence: >
  Written by Phase 1 backfill (commits 6-7), updated on subsequent ingestion
  runs; trust_score recomputed by the batch job (commit 10).

key_metrics:
  - name: data_confidence_score
    description: Computed 0.0–1.0 confidence that the CANONICAL RECORD is right (meta).
    source_column: data_confidence_score
    usage: internal_ranking_and_context, not_hard_filter
    purpose: How confident are we in the record? Driven by source reliability, freshness, cross-source agreement, completeness.
  - name: operator_trust_score
    description: Computed 0.0–1.0 trust in the OPERATOR as an entity (substantive).
    source_column: operator_trust_score
    usage: internal_ranking_and_context, not_hard_filter
    purpose: How trustworthy is this operator? Driven by safety ratings, accident history, multi-source corroboration, identity stability. OSA is a charter brokerage — these scores never gate customer access to any legally-operating carrier.
  - name: operator_age_days
    description: Days since OSA first saw this operator
    source_column: derived (NOW() - first_seen_at)
  - name: staleness_days
    description: Days since any field changed
    source_column: derived (NOW() - last_updated_at)

key_dimensions:
  - name: type_tags
    description: Multi-valued categorisation. An operator can be charter + management simultaneously.
    values: [charter, fractional, corporate, air_ambulance, cargo, management, military, government]
  - name: operator_type
    description: >
      Single-valued legal/operational classification. Orthogonal to type_tags —
      type_tags says what they do (multi), operator_type says what they are (one).
      Nullable; only well-known classifications are backfilled, the rest await audit.
      Values — part_135: US charter cert; part_121: US airline cert; part_91k: US
      fractional; foreign_aoc: non-US AOC; broker: DOT Part 295 broker (no cert);
      billing_agent: IATA SIS billing entity, not an operator; financier: aircraft
      finance co that holds title but does not operate; holding_co: parent-group
      entity that does not fly; defunct: prior operator no longer operating;
      trust_holder: legal trust holding aircraft on behalf of beneficial owners.
    values: [part_135, part_121, part_91k, foreign_aoc, broker, billing_agent, financier, holding_co, defunct, trust_holder]
  - name: headquarters_icao
    description: ICAO of the registered or most-frequent operating base

source_attribution: >
  Each row is backed by operator_identities rows naming the sources (faa,
  argus, wyvern, isbao, adsb, manual). Join on operator_id for provenance.

data_confidence_score_inputs:
  - component: source_reliability
    weight: 0.40
    description: Max across identities (faa=1.0, argus=0.9, wyvern=0.85, isbao=0.85, scrape=0.7, manual=0.5)
  - component: data_freshness
    weight: 0.25
    description: Exp decay on most recent last_verified_at; half-life 180 days
  - component: cross_source_agreement
    weight: 0.20
    description: min(1.0, n_distinct_sources / 3)
  - component: completeness
    weight: 0.15
    description: Fraction of expected fields populated

operator_trust_score_inputs:
  - component: safety_rating
    weight: 0.40
    description: Max across SAFETY-source reliability only (argus=0.90, wyvern=0.85, isbao=0.85). FAA registry presence does not contribute — not a safety signal.
  - component: accident_history
    weight: 0.25
    description: "1.0 - min(1.0, accidents_last_10y * 0.15). 0 accidents → 1.0, 7+ → 0.0. Phase-1 limitation: only accidents on FAA-linked aircraft count; non-US + synthetic-cert operators read as zero accidents."
  - component: source_count
    weight: 0.20
    description: min(1.0, distinct_source_count / 3). Multi-source corroboration signal.
  - component: identity_stability
    weight: 0.15
    description: "v0 proxy: 1.0 if 2+ sources AND known ≥365 days; 0.7 if 2+ sources newer; 0.5 otherwise. Refine when aircraft_operator_history + operator_events land."

related_tables:
  - operator_identities: 1:N — per-source linkage
  - operator_aliases: 1:N — name variants
  - operator_match_review: 1:N via resolution_operator_id — ambiguous matches
